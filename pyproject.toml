[project]
name = "reelcraft"
dynamic = ["version"]  # from src/reelcraft/__init__.py, bumped by release-please
description = "A production line for short-form video, from the CLI or a web dashboard."
authors = [
    { name = "iqbalrpambudi", email = "iqbal.pambudi@dataon.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "opencv-python-headless>=5.1.0.95",
    "pydantic-ai-slim[google,openai]>=2.71.0",
    "pydantic-settings>=2.16.3",
    "pysubs2>=1.9.1",
    "python-multipart>=0.0.34",
    "scenedetect>=0.7.3",
    "sqlalchemy>=2.1.9",
    "structlog>=26.1.0",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
reelcraft = "reelcraft.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "commitizen>=4.19.4",
    "httpx>=0.28.1",
    "import-linter>=2.17",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.hatch.version]
path = "src/reelcraft/__init__.py"

[tool.hatch.build]
# The web build is gitignored but must ship inside the wheel
artifacts = ["src/reelcraft/api/static/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.importlinter]
root_package = "reelcraft"

[[tool.importlinter.contracts]]
name = "Each layer imports only the layers below it"
type = "layers"
layers = [
    "reelcraft.cli",
    "reelcraft.api",
    "reelcraft.services",
    "reelcraft.pipeline",
    "reelcraft.ai | reelcraft.publish",
    "reelcraft.storage | reelcraft.media",
    "reelcraft.core",
]

[tool.commitizen]
name = "cz_conventional_commits"
