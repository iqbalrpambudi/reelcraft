name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pr-title:
    # PRs are squash-merged, so the PR title becomes the commit release-please reads
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # upstream publishes no floating major tag
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run lint-imports
      - name: Migrations match models
        run: REELCRAFT_DATA_DIR=$(mktemp -d) sh -c 'uv run alembic upgrade head && uv run alembic check'
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v10.4.0  # upstream publishes no floating major tag
      - run: npm ci
      - name: API types match the backend
        working-directory: .
        run: make api-types && git diff --exit-code web/src/api/schema.d.ts
      - run: npm run lint
      - run: npm run build
